[package]
name = "mcpdoze"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
mcpdoze-core = { path = "../mcpdoze-core" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "signal", "macros", "time"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "native-tls"] }

[dev-dependencies]
mcpdoze-testkit = { path = "../mcpdoze-testkit" }
tempfile = "3.27.0"
