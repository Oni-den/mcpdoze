[package]
name = "mcpdoze"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared, lazy, idle-unloading HTTP broker for MCP servers"
readme = "../../README.md"
keywords = ["mcp", "model-context-protocol", "broker", "agents", "proxy"]
categories = ["command-line-utilities", "development-tools"]
homepage = "https://github.com/Oni-den/mcpdoze"

[lints]
workspace = true

[dependencies]
mcpdoze-core = { path = "../mcpdoze-core", version = "0.3.0" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "signal", "macros", "time"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }

[dev-dependencies]
mcpdoze-testkit = { path = "../mcpdoze-testkit" }
tempfile = "3.27.0"
