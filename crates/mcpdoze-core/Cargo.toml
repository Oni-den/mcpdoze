[package]
name = "mcpdoze-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "rt", "macros", "time", "io-util"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_Security"] }

[target."cfg(unix)".dependencies]
nix = { version = "0.32.0", features = ["process", "signal"] }
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }

[dev-dependencies]
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
